name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.1.5, etc.

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install test frameworks
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r src/test/fixtures/execution/requirements.txt
        
    - name: Install dependencies
      run: npm ci
      
    - name: Verify release tag before building
      run: node scripts/release.cjs check-tag

    - name: Verify prerequisites
      run: |
        echo "Verifying prerequisites..."
        node --version
        npm --version
        python --version
        behave --version
        npx tsc --version
        npx eslint --version
        echo "✅ All prerequisites verified"
      
    - name: Install Xvfb (VS Code Electron needs a display on Linux)
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Run tests
      run: |
        echo "Running tests before release..."
        xvfb-run -a npm test
        echo "✅ All tests passed"
      
    - name: Create and verify VSIX package
      id: artifact
      run: npm run package:vsix

    - name: Generate changelog
      id: changelog
      run: |
        echo "Generating changelog..."
        if git describe --tags --abbrev=0 --exclude="$GITHUB_REF_NAME" > /dev/null 2>&1; then
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude="$GITHUB_REF_NAME")
          CHANGELOG=$(git log --pretty=format:"- %s" "$PREVIOUS_TAG"..HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s" --reverse)
        fi

        # Use a heredoc delimiter to preserve newlines (GitHub Actions multi-line output)
        {
          echo "changelog<<EOF_CHANGELOG"
          echo "$CHANGELOG"
          echo "EOF_CHANGELOG"
        } >> "$GITHUB_OUTPUT"
        echo "Changelog generated"

    - name: Create Release and Upload VSIX
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Behave Test Runner v${{ steps.artifact.outputs.version }}
        body: |
          ## Behave Test Runner Extension v${{ steps.artifact.outputs.version }}

          ### Changes in this release:
          ${{ steps.changelog.outputs.changelog }}

          ### Installation

          **From VSIX:**
          1. Download the `.vsix` file from this release
          2. In VS Code, go to Extensions (Ctrl+Shift+X)
          3. Click the "..." menu and select "Install from VSIX..."
          4. Select the downloaded file

          **From VS Code Marketplace:**
          Search for "Behave Test Runner" in the Extensions marketplace

          ### Prerequisites
          - Python with Behave or pytest-bdd installed
          - VS Code 1.99.0 or later

          ### Features
          - 🔍 Automatic Test Discovery
          - ▶️ Run Tests with one click
          - 🐛 Debug Support
          - 📊 Test Explorer Integration
          - 🎯 CodeLens Support
          - 🏷️ Tag-based Organization
          - 📋 Scenario Outline Support (incl. multiple, named, and tagged Examples blocks)
          - 🚀 Parallel Execution

          ### Documentation
          See the [README](https://github.com/upscaled-dev/behave-vsc-extension#readme) for detailed usage instructions.
        draft: false
        prerelease: false
        files: ${{ steps.artifact.outputs.artifact }}
        fail_on_unmatched_files: true
      
    - name: Publish to Visual Studio Marketplace
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: node scripts/release.cjs publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: ${{ steps.artifact.outputs.artifact }}
        if-no-files-found: error
        retention-days: 30
      
    - name: Notify success
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
        VERSION: ${{ steps.artifact.outputs.version }}
        RELEASE_URL: ${{ steps.create_release.outputs.url }}
      run: |
        echo "🎉 Release v${VERSION} created successfully!"
        echo "📦 VSIX package uploaded to GitHub releases"
        echo "🔗 Release URL: ${RELEASE_URL}"

        if [[ -n "$VSCE_PAT" ]]; then
          echo "🏪 Extension published to Visual Studio Marketplace"
          echo "🔗 Marketplace URL: https://marketplace.visualstudio.com/items?itemName=upscaled-dev.behave-test-runner"
        else
          echo "⚠️  Marketplace publish skipped (VSCE_PAT not configured)"
        fi
